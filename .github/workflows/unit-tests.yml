name: Unit Tests

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Firebase config is gitignored (contains project secrets) and is not needed to
      # compile or run unit tests. This placeholder just satisfies the google-services
      # plugin so the build can configure the production and capture flavors.
      - name: Write placeholder Firebase config
        run: |
          for flavor in production capture; do
            mkdir -p app/src/$flavor
            cat > app/src/$flavor/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.jugurdzija.homeshelf" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "ci-placeholder-key" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          done

      - name: Run unit tests
        run: ./gradlew testProductionDebugUnitTest -PDEFAULT_WEB_CLIENT_ID=ci-placeholder --stacktrace

      - name: Generate coverage report
        if: always()
        run: ./gradlew jacocoTestReport -x testProductionDebugUnitTest -PDEFAULT_WEB_CLIENT_ID=ci-placeholder

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Test Results
          path: app/build/test-results/testProductionDebugUnitTest/*.xml
          reporter: java-junit

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: app/build/reports/jacoco/jacocoTestReport/html
